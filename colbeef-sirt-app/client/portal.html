<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colbeef · Portal de acceso</title>
  <link rel="icon" href="/colbeef-icon.png" type="image/png">
  <style>
    :root{--vp:#259c39;--vc:#b7e4c7;--gris:#6b7280;--fondo:#f8faf9;--sombra:0 8px 24px rgba(37,156,57,0.1);}
    *{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--fondo);padding:1.5rem;}
    .card{background:#fff;border-radius:20px;padding:2rem;max-width:440px;width:100%;box-shadow:var(--sombra);border:1px solid var(--vc);}
    .logo{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;}
    .logo img{width:56px;height:56px;border-radius:14px;object-fit:contain;}
    h1{margin:0;font-size:1.45rem;color:#111827;}
    p{margin:0.35rem 0 0;color:var(--gris);font-size:0.9rem;}
    label{display:block;font-size:0.82rem;font-weight:600;color:#374151;margin:1.2rem 0 0.4rem;}
    input{width:100%;padding:0.75rem 0.9rem;border:1.5px solid var(--vc);border-radius:12px;font-size:1rem;}
    input:focus{outline:none;border-color:var(--vp);}
    .btn{width:100%;margin-top:1.2rem;padding:0.85rem;border:none;border-radius:12px;background:var(--vp);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;}
    .btn:hover{filter:brightness(1.05);}
    .btn:disabled{opacity:0.65;cursor:wait;}
    .err{color:#dc2626;font-size:0.85rem;margin-top:0.75rem;display:none;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/colbeef-icon.png" alt="Colbeef">
      <div>
        <h1>Gestor de Vísceras</h1>
        <p>Usuario y contraseña para ingresar</p>
      </div>
    </div>

    <form id="portalForm" autocomplete="on">
      <label for="usuarioInput">Usuario</label>
      <input id="usuarioInput" name="username" type="text" placeholder="Ej: sergio anaya" required autocomplete="username">
      <label for="passwordInput">Contraseña</label>
      <input id="passwordInput" name="password" type="password" placeholder="Contraseña" required autocomplete="current-password">
      <button class="btn" id="loginBtn" type="submit">Entrar al gestor →</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>

  <script src="/usabilidad-tracker.js"></script>
  <script>
    (function () {
      var TOKEN_KEY = 'colbeef_auth_token';
      var input = document.getElementById('usuarioInput');
      var pass = document.getElementById('passwordInput');
      var err = document.getElementById('loginErr');
      var btn = document.getElementById('loginBtn');
      var params = new URLSearchParams(location.search);
      var pre = params.get('usuario');
      if (pre) input.value = pre;

      function showErr(msg) {
        err.textContent = msg || '';
        err.style.display = msg ? 'block' : 'none';
      }

      // Si ya hay sesión válida, ir al gestor
      var existing = sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY);
      if (existing) {
        fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + existing } })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (!data.success) return;
            localStorage.setItem('colbeef_usuario', data.usuario);
            location.replace('/gestor.html?usuario=' + encodeURIComponent(data.usuario));
          })
          .catch(function () {});
      }

      document.getElementById('portalForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var user = input.value.trim();
        var password = pass.value;
        if (!user || !password) return;
        showErr('');
        btn.disabled = true;
        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: user, password: password }),
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            btn.disabled = false;
            if (!res.ok || !res.d.success) {
              showErr(res.d.message || 'No se pudo iniciar sesión');
              return;
            }
            sessionStorage.setItem(TOKEN_KEY, res.d.token);
            localStorage.setItem(TOKEN_KEY, res.d.token);
            localStorage.setItem('colbeef_usuario', res.d.usuario);
            localStorage.setItem('colbeef_rol', res.d.rol || 'operador');
            if (window.ColbeefUsage) {
              ColbeefUsage.setUsuario(res.d.usuario);
              ColbeefUsage.track('portal_enter', 'portal', 'Login OK');
            }
            location.href = '/gestor.html?usuario=' + encodeURIComponent(res.d.usuario);
          })
          .catch(function () {
            btn.disabled = false;
            showErr('Error de red o servidor. ¿MySQL y el API están activos?');
          });
      });
    })();
  </script>
</body>
</html>
