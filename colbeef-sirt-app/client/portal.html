<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colbeef · Portal de acceso</title>
  <link rel="icon" href="/colbeef-icon.png" type="image/png">
  <style>
    :root{--vp:#259c39;--vc:#b7e4c7;--gris:#6b7280;--fondo:#f8faf9;--sombra:0 8px 24px rgba(37,156,57,0.1);}
    *{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--fondo);padding:1.5rem;}
    .card{background:#fff;border-radius:20px;padding:2rem;max-width:440px;width:100%;box-shadow:var(--sombra);border:1px solid var(--vc);}
    .logo{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;}
    .logo img{width:56px;height:56px;border-radius:14px;object-fit:contain;}
    h1{margin:0;font-size:1.45rem;color:#111827;}
    p{margin:0.35rem 0 0;color:var(--gris);font-size:0.9rem;}
    label{display:block;font-size:0.82rem;font-weight:600;color:#374151;margin:1.2rem 0 0.4rem;}
    input{width:100%;padding:0.75rem 0.9rem;border:1.5px solid var(--vc);border-radius:12px;font-size:1rem;}
    input:focus{outline:none;border-color:var(--vp);}
    .btn{width:100%;margin-top:1.2rem;padding:0.85rem;border:none;border-radius:12px;background:var(--vp);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;}
    .btn:hover{filter:brightness(1.05);}
    .link-box{margin-top:1.4rem;padding:1rem;background:#f0fdf4;border-radius:12px;border:1px solid var(--vc);}
    .link-box h3{margin:0 0 0.5rem;font-size:0.85rem;color:var(--vp);}
    .link-box code{display:block;font-size:0.75rem;word-break:break-all;color:#374151;background:#fff;padding:0.6rem;border-radius:8px;border:1px solid #e5e7eb;}
    .copy-btn{margin-top:0.5rem;padding:0.45rem 0.8rem;border:1px solid var(--vc);background:#fff;border-radius:8px;cursor:pointer;font-size:0.8rem;color:var(--vp);font-weight:600;}
    .msg{margin-top:0.8rem;font-size:0.82rem;color:var(--gris);}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/colbeef-icon.png" alt="Colbeef">
      <div>
        <h1>Gestor de Vísceras</h1>
        <p>Identifíquese para continuar</p>
      </div>
    </div>

    <form id="portalForm">
      <label for="usuarioInput">Usuario / nombre</label>
      <input id="usuarioInput" type="text" placeholder="Ej: jperez, operador1" required autocomplete="username">
      <button class="btn" type="submit">Entrar al gestor →</button>
    </form>

    <div class="link-box">
      <h3>Enlace para otro programa</h3>
      <code id="embedLink">Ingrese un usuario arriba</code>
      <button type="button" class="copy-btn" id="copyLinkBtn">Copiar enlace</button>
      <p class="msg">Use este URL en un botón externo; el parámetro <strong>usuario</strong> queda registrado en usabilidad.</p>
    </div>
  </div>

  <script src="/usabilidad-tracker.js"></script>
  <script>
    (function () {
      var input = document.getElementById('usuarioInput');
      var embed = document.getElementById('embedLink');
      var params = new URLSearchParams(location.search);
      var pre = params.get('usuario');
      if (pre) input.value = pre;

      function buildLink(user) {
        var u = encodeURIComponent(String(user || '').trim());
        return location.origin + '/gestor.html?usuario=' + u;
      }

      function updateLink() {
        var u = input.value.trim();
        embed.textContent = u ? buildLink(u) : 'Ingrese un usuario arriba';
      }

      input.addEventListener('input', updateLink);
      updateLink();

      document.getElementById('portalForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var user = input.value.trim();
        if (!user) return;
        localStorage.setItem('colbeef_usuario', user);
        ColbeefUsage.setUsuario(user);
        ColbeefUsage.track('portal_enter', 'portal', 'Entrada desde portal');
        location.href = buildLink(user);
      });

      document.getElementById('copyLinkBtn').addEventListener('click', function () {
        var u = input.value.trim();
        if (!u) return;
        var link = buildLink(u);
        navigator.clipboard.writeText(link).then(function () {
          document.getElementById('copyLinkBtn').textContent = '✓ Copiado';
          setTimeout(function () {
            document.getElementById('copyLinkBtn').textContent = 'Copiar enlace';
          }, 2000);
        });
      });

      if (pre && params.get('auto') === '1') {
        document.getElementById('portalForm').requestSubmit();
      }
    })();
  </script>
</body>
</html>
