<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colbeef · Portal de acceso</title>
  <link rel="icon" href="/colbeef-icon.png" type="image/png">
  <style>
    :root{--vp:#259c39;--vc:#b7e4c7;--gris:#6b7280;--fondo:#f8faf9;--sombra:0 8px 24px rgba(37,156,57,0.1);}
    *{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--fondo);padding:1.5rem;}
    .card{background:#fff;border-radius:20px;padding:2rem;max-width:440px;width:100%;box-shadow:var(--sombra);border:1px solid var(--vc);}
    .logo{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;}
    .logo img{width:56px;height:56px;border-radius:14px;object-fit:contain;}
    h1{margin:0;font-size:1.45rem;color:#111827;}
    p{margin:0.35rem 0 0;color:var(--gris);font-size:0.9rem;}
    label{display:block;font-size:0.82rem;font-weight:600;color:#374151;margin:1.2rem 0 0.4rem;}
    input{width:100%;padding:0.75rem 0.9rem;border:1.5px solid var(--vc);border-radius:12px;font-size:1rem;}
    input:focus{outline:none;border-color:var(--vp);}
    .btn{width:100%;margin-top:1.2rem;padding:0.85rem;border:none;border-radius:12px;background:var(--vp);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;}
    .btn:hover{filter:brightness(1.05);}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/colbeef-icon.png" alt="Colbeef">
      <div>
        <h1>Gestor de Vísceras</h1>
        <p>Indique su nombre para continuar</p>
      </div>
    </div>

    <form id="portalForm">
      <label for="usuarioInput">Nombre del operador</label>
      <input id="usuarioInput" type="text" placeholder="Ej: Sergio Anaya" required autocomplete="username">
      <button class="btn" type="submit">Entrar al gestor →</button>
    </form>
  </div>

  <script src="/usabilidad-tracker.js"></script>
  <script>
    (function () {
      var input = document.getElementById('usuarioInput');
      var params = new URLSearchParams(location.search);
      var pre = params.get('usuario');
      var stored = '';
      try { stored = localStorage.getItem('colbeef_usuario') || ''; } catch (_) {}
      if (pre) input.value = pre;
      else if (stored && stored !== 'anonimo') input.value = stored;

      document.getElementById('portalForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var user = input.value.trim();
        if (!user) return;
        localStorage.setItem('colbeef_usuario', user);
        if (window.ColbeefUsage) {
          ColbeefUsage.setUsuario(user);
          ColbeefUsage.track('portal_enter', 'portal', 'Entrada con nombre');
        }
        location.href = '/gestor.html?usuario=' + encodeURIComponent(user);
      });
    })();
  </script>
</body>
</html>
